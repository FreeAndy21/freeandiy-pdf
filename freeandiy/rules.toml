# FreeANDIY rebrand rules for this repository (applied by freeandiy/tools/rebrand, after the
# patches in freeandiy/patches/). Modified-by: FreeANDIY (Free Andy Agency), 2026.
#
# Double-brace placeholders (e.g. this.name) come from branding.toml and app.toml (`rebrand vars`
# lists them). Every rule has a minimum match count: when upstream renames or moves something, the
# rule fails loudly instead of silently leaving the old brand in place.
#
# Protected text: rules first swap text that must keep the upstream name (cargo package names,
# file names we keep) for @@...@@ markers, and the last rules swap them back. The product name
# is replaced as a whole word only: `PdfCraftApp` and the other type names stay.

# Copied files whose placeholders are filled in at the end.
templates = [
  "crates/ui-egui/src/freeandiy.rs",
  "crates/ui-egui/src/i18n/sk.tsv",
]

delete = [
  "docs/brand",                                  # ArtCraft marks: forks must remove them
  # upstream's app icon (ours is copied in below); the PDF document icon (Lucide-based) stays
  "assets/app-icon/hicolor",
  "assets/app-icon/pdfcraft-1024.png",
  "assets/app-icon/pdfcraft-small.svg",
  "assets/app-icon/pdfcraft.icns",
  "assets/app-icon/pdfcraft.ico",
  "assets/app-icon/pdfcraft.svg",
  "assets/app-icon/README.md",
  "assets/app-icon/LICENSE.txt",
  ".github/workflows/release.yml",               # upstream's release and platform jobs (craft-common-actions: no licence)
  ".github/workflows/windows-arm64.yml",
  ".github/workflows/packaging-lint.yml",
  ".github/workflows/freebsd.yml",
  "packaging/icons.sh",                          # icons come from the FreeANDIY meta repository
  "packaging/macos/dmg",                         # background and layout derived from upstream's icon; ours is copied in
]

# Translation catalogs: drop the Discord and community entries (the strings are gone from the UI);
# other ArtCraft mentions become FreeANDIY below, so complete catalogs stay complete.
[[drop_lines]]
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = '^[^#\n]*(Discord|getartcraft|ArtCraft community)'
min = 30

# ---------------------------------------------------------------------------------------------
# Identifiers, maintainers, URLs.

[[replace]]
name = "app id"
include = ["**"]
exclude = ["**/*.md", "docs/**", "NOTICE", "ATTRIBUTION.toml"]
find = "ai.storyteller.pdfcraft"
replace = "{{this.app_id}}"
min = 20

[[replace]]
name = "developer id"
include = ["packaging/**"]
find = "ai.storyteller"
replace = "{{brand.id_prefix}}"
min = 0

[[replace]]
name = "package maintainer"
include = ["packaging/**"]
find = "PdfCraft maintainers <pdfcraft@storyteller.ai>"
replace = "{{brand.maintainer}}"
min = 1

[[replace]]
name = "links: this app's page (code)"
include = ["**/*.rs"]
find = "https://getartcraft.com/apps/pdfcraft"
replace = "{{this.page}}"
skip_comments = ["//"]
min = 1

[[replace]]
name = "links: website (code)"
include = ["**/*.rs"]
find = "https://getartcraft.com"
replace = "{{brand.website}}"
skip_comments = ["//"]
min = 1

[[replace]]
name = "links: repository, releases, issues (code: Help, update check, CLI)"
include = ["**/*.rs"]
exclude = ["vendor/**"]
find = "https://github.com/storytold/pdfcraft"
replace = "{{this.github}}"
skip_comments = ["//"]
min = 6

[[replace]]
name = "update check: GitHub API repository"
include = ["apps/pdfcraft/src/updates.rs"]
find = "repos/storytold/pdfcraft/"
replace = "repos/{{brand.github_owner}}/{{this.repo}}/"
min = 1

[[replace]]
name = "website label (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/src/i18n/*.tsv"]
find = "ArtCraft website"
replace = "{{brand.name}} website"
min = 3

[[replace]]
name = "catalogs: other ArtCraft mentions"
include = ["crates/ui-egui/src/i18n/*.tsv"]
find = "ArtCraft"
replace = "{{brand.name}}"
min = 1

[[replace]]
name = "upstream issues URL"
include = ["packaging/**", ".github/**"]
find = "https://github.com/storytold/pdfcraft/issues"
replace = "{{this.issues}}"
min = 0

[[replace]]
name = "upstream repository URL"
include = ["packaging/**", ".github/**"]
regex = 'https://github\.com/storytold/pdfcraft(/|"|<|\x27|$)'
replace = "{{this.github}}${1}"
min = 1

[[replace]]
name = "upstream repo slug (raw URLs, GITHUB_REPOSITORY defaults)"
include = ["packaging/**", ".github/**"]
regex = 'storytold/pdfcraft\b'
replace = "{{brand.github_owner}}/{{this.repo}}"
min = 1

[[replace]]
name = "upstream product page"
include = ["packaging/**", ".github/**"]
find = "https://getartcraft.com/apps/pdfcraft"
replace = "{{this.page}}"
min = 2

[[replace]]
name = "upstream Discord (packaging contact/help links)"
include = ["packaging/**"]
find = "https://discord.gg/artcraft"
replace = "{{this.issues}}"
min = 0

[[replace]]
name = "Crafting Apps"
include = ["crates/**/*.rs", "apps/**/*.rs", "packaging/**"]
find = "Crafting Apps"
replace = "{{brand.name}} apps"
min = 0

[[replace]]
name = "OCR models folder (code and its layout test)"
include = ["crates/ocr/src/lib.rs"]
find = "share/pdfcraft/"
replace = "share/{{this.repo}}/"
min = 5

[[replace]]
name = "portable data folder"
include = ["**/*.rs", "packaging/**"]
find = "PdfCraftData"
replace = "{{this.name}} Data"
min = 3

# ---------------------------------------------------------------------------------------------
# Protect text that keeps the upstream name.

[[replace]]
name = "protect: attribution 'the PdfCraft authors'"
include = ["apps/*/build.rs", "packaging/**"]
find = "the PdfCraft authors"
replace = "{{brand.owner}} and the @@UPSTREAM@@ authors"
min = 0

[[replace]]
name = "protect: the PDF document icon file names"
include = ["**"]
find = "pdfcraft-document"
replace = "@@PKG@@-document"
min = 3

[[replace]]
name = "web release zip: freeandiy-pdf-<version>-web-wasm32.zip (before the crate-name protect)"
include = ["packaging/web/package.sh", "packaging/web/README.md", "docs/releasing.md"]
regex = 'pdfcraft-web-(<version>|<v>|\$VERSION)'
replace = "{{this.repo}}-${1}-web-wasm32"
min = 2

[[replace]]
name = "protect: cargo -p / --package pdfcraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(-p|--package) pdfcraft'
replace = '$1 @@PKG@@'
min = 3

[[replace]]
name = "protect: crate names pdfcraft-<crate>"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'pdfcraft-(a11y|annot|audit|automation|compare|content|cos|create|crypt|edit|engine|export|filters|fonts|forms|geom|js|measure|model|ocr|optimize|organize|platform|preflight|print|redact|render|sign|ui-egui|xfa|xfdf|web)\b'
replace = '@@PKG@@-$1'
min = 1

[[replace]]
name = "protect: source paths apps/pdfcraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(apps[/\\])pdfcraft'
replace = '${1}@@PKG@@'
min = 1

[[replace]]
name = "protect: crate idents pdfcraft_"
include = ["packaging/**", ".github/**", "Dockerfile"]
find = "pdfcraft_"
replace = "@@PKG@@_"
min = 0

[[replace]]
name = "protect: WiX sources pdfcraft.wxs"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'pdfcraft(\.wxs|\.en-us\.wxl)'
replace = '@@PKG@@${1}'
min = 1

# ---------------------------------------------------------------------------------------------
# The product name in the UI, messages, translations, packaging and the web page.

[[replace]]
name = "Info.plist custom keys: PdfCraftVersion, PdfCraftBuildCommit"
include = ["packaging/**"]
regex = 'PdfCraft(Version|BuildCommit)'
replace = 'FreeANDIYPDF${1}'
min = 2

[[replace]]
name = "name + inflection (cs/pl/...): PdfCraftu"
include = ["crates/ui-egui/src/i18n/*.tsv"]
regex = 'PdfCraft[a-z]+'
replace = "{{this.name}}"
min = 0

[[replace]]
name = "protect: the content-stream wrap markers (q %PdfCraft / Q %PdfCraft: recognised in files either app edited)"
include = ["crates/edit/src/*.rs"]
regex = '([qQ] %)PdfCraft'
replace = '${1}@@PDFWRAP@@'
min = 4

[[replace]]
name = "product name PdfCraft (Rust code, not comments; whole word: PdfCraftApp stays)"
include = ["**/*.rs"]
# crates/edit/src/tests.rs: its texts are typed with test fonts that carry only the glyphs they need.
exclude = ["xtask/**", "vendor/**", "crates/edit/src/tests.rs"]
regex = '\bPdfCraft\b'
replace = "{{this.name}}"
skip_comments = ["//"]
min = 110

[[replace]]
name = "product name PdfCraft (catalogs: any script may follow it, e.g. Telugu suffixes)"
include = ["**/*.tsv"]
find = "PdfCraft"
replace = "{{this.name}}"
min = 300

[[replace]]
name = "product name PdfCraft (packaging, web page, CI)"
include = ["packaging/**", "apps/pdfcraft-web/index.html", ".github/**", "Dockerfile"]
exclude = ["**/*.md"]
regex = '\bPdfCraft\b'
replace = "{{this.name}}"
min = 30

# ---------------------------------------------------------------------------------------------
# Executables, packaging file names.

[[replace]]
name = "test binaries CARGO_BIN_EXE_pdfcraft"
include = ["apps/**/*.rs"]
find = "CARGO_BIN_EXE_pdfcraft"
replace = "CARGO_BIN_EXE_{{this.repo}}"
min = 4

[[replace]]
name = "cli executable name in code"
include = ["apps/**/*.rs", "crates/**/*.rs"]
regex = '\bpdfcraft-cli\b'
replace = "{{this.repo}}-cli"
min = 5

[[replace]]
name = "icon file paths in code (assets/app-icon/pdfcraft*)"
include = ["apps/**/*.rs", "crates/**/*.rs", "apps/*/build.rs"]
find = "app-icon/pdfcraft"
replace = "app-icon/{{this.repo}}"
min = 3

[[replace]]
name = "windows exe resources"
include = ["apps/*/build.rs"]
regex = '"pdfcraft(\.exe)?"'
replace = '"{{this.repo}}${1}"'
min = 0

[[replace]]
name = "packaging/CI: executables, file names, paths"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'pdfcraft'
replace = "{{this.repo}}"
min = 60

[[replace]]
name = "MSI UpgradeCode (new GUID)"
include = ["packaging/windows/*.wxs"]
regex = 'UpgradeCode="[0-9A-Fa-f-]{36}"'
replace = 'UpgradeCode="{{this.msi_upgrade_code}}"'
min = 1

[[replace]]
name = "MSI app component GUID (new GUID)"
include = ["packaging/windows/*.wxs"]
find = "E724C1C6-091F-4E21-A685-80D089FDBE21"
replace = "{{this.msi_component_guid}}"
min = 1

[[replace]]
name = "MSI Start Menu shortcut component GUID (new GUID)"
include = ["packaging/windows/*.wxs"]
find = "DC028192-C233-4F99-9A77-ED458C60DF26"
replace = "{{msi.start_menu_guid}}"
min = 1

[[replace]]
name = "MSI desktop shortcut component GUID (new GUID)"
include = ["packaging/windows/*.wxs"]
find = "F6948627-32AB-4D78-8865-0FDF417CE442"
replace = "{{msi.desktop_guid}}"
min = 1

[[replace]]
name = "MSI PDF context menu component GUID (new GUID)"
include = ["packaging/windows/*.wxs"]
find = "439F084F-657D-4AC2-A4CC-F099C518D71F"
replace = "{{msi.context_menu_guid}}"
min = 1

# ---------------------------------------------------------------------------------------------
# Restore protected text.

[[replace]]
name = "restore @@UPSTREAM@@"
include = ["**"]
find = "@@UPSTREAM@@"
replace = "{{this.upstream_name}}"
min = 0

[[replace]]
name = "restore @@PKG@@"
include = ["**"]
find = "@@PKG@@"
replace = "pdfcraft"
min = 8

# ---------------------------------------------------------------------------------------------

# Upstream's README stays available; ours replaces it at the root.
[[rename]]
include = ["README.md"]
find = "README.md"
replace = "docs/upstream-README.md"
min = 1

[[rename]]
include = ["packaging/**"]
find = "ai.storyteller.pdfcraft"
replace = "{{this.app_id}}"
min = 3

